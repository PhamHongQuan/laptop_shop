version: "3.9"

services:

  nginx:
    image: nginx:latest
    container_name: laptop-nginx

    ports:
      - "8080:80"

    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laptop-php

    working_dir: /var/www/html

    volumes:
      - ./src:/var/www/html

    depends_on:
      - mysql

  mysql:
    image: mysql:8.4

    container_name: laptop-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laptop_shop

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7

    container_name: laptop-redis

    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit

    container_name: laptop-mailpit

    ports:
      - "1025:1025"
      - "8025:8025"

volumes:

  mysql_data: